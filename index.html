<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/x-icon" href="/telegram.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuVault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#f8fafc; --surface:#fff; --surface2:#f1f5f9; --text:#0f172a;
  --muted:#64748b; --border:#e2e8f0; --primary:#6366f1;
  --primary-rgb:99,102,241; --accent-rgb:139,92,246;
  --primary-hover:#4f46e5; --primary-text:#fff; --accent:#8b5cf6;
  --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body.dark { --shadow:0 4px 16px rgba(0,0,0,.45); }
body { font-family:var(--font); background:var(--bg); color:var(--text); transition:background .25s,color .25s; min-height:100vh; overflow:hidden; }
.hidden { display:none !important; }
.screen { min-height:100vh; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea,select { font-family:inherit; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }

#login-screen { display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(135deg,var(--bg) 0%,var(--surface2) 100%); }
.login-card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:40px 32px; box-shadow:var(--shadow); text-align:center; animation:fadeUp .5s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
.login-logo { width:80px; height:80px; margin:0 auto 20px; border-radius:22px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 24px rgba(var(--primary-rgb),.35); overflow:hidden; }
.login-logo-emoji { font-size:42px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.15)); display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
.login-logo-emoji img { width:60%; height:60%; object-fit:contain; }
.login-card h1 { font-size:26px; margin-bottom:6px; }
.login-sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
.field { display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; transition:border-color .2s; }
.field:focus-within { border-color:var(--primary); }
.field i { color:var(--muted); }
.field input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; }
.btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:12px; background:var(--primary); color:var(--primary-text); font-weight:600; font-size:15px; transition:transform .15s,background .2s; }
.btn-primary:hover { background:var(--primary-hover); transform:translateY(-1px); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }
.btn-primary.btn-danger { background:var(--danger); }
.btn-primary.btn-danger:hover { background:#dc2626; }
.login-card .btn-primary { width:100%; margin-top:8px; padding:15px; }
.login-error { color:var(--danger); font-size:13px; margin-top:14px; min-height:18px; }

#app { display:flex; flex-direction:column; height:100vh; }
.topbar { display:flex; align-items:center; gap:10px; padding:12px 18px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.icon-btn { width:38px; height:38px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; color:var(--text); transition:background .15s; font-size:15px; }
.icon-btn:hover { background:var(--surface2); }
.icon-btn.small { width:30px; height:30px; font-size:13px; }
.brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; }
.brand-icon { font-size:22px; line-height:1; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; }
.brand-icon img { width:100%; height:100%; object-fit:contain; border-radius:4px; }
.topbar-actions { display:flex; align-items:center; gap:6px; margin-left:auto; }
.user-chip { display:flex; align-items:center; gap:8px; padding:5px 8px 5px 5px; background:var(--surface2); border-radius:30px; margin-left:6px; }
.avatar { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
.user-chip span { font-size:13px; font-weight:600; }

.layout { flex:1; display:flex; overflow:hidden; }
.sidebar { width:280px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:18px; flex-shrink:0; transition:margin-left .25s, transform .25s; }
.sidebar-section { display:flex; flex-direction:column; gap:4px; }
.w-full { width:100%; }
.section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding:0 6px; }
.sidebar-nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition:background .15s; }
.sidebar-nav-item:hover { background:var(--surface2); }
.sidebar-nav-item.active { background:var(--primary); color:var(--primary-text); }
.sidebar-nav-item i { width:16px; text-align:center; font-size:14px; }

.folder-tree { display:flex; flex-direction:column; gap:2px; }
.folder-item { display:flex; align-items:center; gap:6px; padding:8px 8px; border-radius:8px; cursor:pointer; font-size:14px; position:relative; transition:background .15s; user-select:none; }
.folder-item:hover { background:var(--surface2); }
.folder-item.active { background:var(--primary); color:var(--primary-text); }
.folder-item > .folder-emoji { font-size:15px; width:18px; text-align:center; flex-shrink:0; }
.folder-item span.fname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chevron-btn { width:20px; height:20px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px; flex-shrink:0; transition:background .15s; }
.chevron-btn:hover { background:rgba(0,0,0,.12); }
.folder-item.active .chevron-btn { color:var(--primary-text); }
.chevron-spacer { width:20px; flex-shrink:0; }
.folder-actions { display:none; gap:2px; }
.folder-item:hover .folder-actions { display:flex; }
.folder-actions button { width:22px; height:22px; border-radius:5px; color:var(--muted); font-size:10px; display:flex; align-items:center; justify-content:center; }
.folder-actions button:hover { background:rgba(0,0,0,.1); color:var(--text); }
.folder-item.active .folder-actions button { color:var(--primary-text); }
.pin-badge { color:var(--accent); font-size:10px; }

.content { flex:1; overflow-y:auto; padding:24px 28px; }
.content-header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); flex-wrap:wrap; }
.breadcrumb a { color:var(--muted); cursor:pointer; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb .sep { opacity:.5; }
.breadcrumb .current { color:var(--text); font-weight:600; }
.header-actions { display:flex; align-items:center; gap:8px; }
.btn-ghost { padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--surface); display:inline-flex; align-items:center; gap:6px; transition:background .15s; }
.btn-ghost:hover { background:var(--surface2); }

.batch-bar { display:flex; align-items:center; gap:8px; padding:10px 14px; margin-bottom:12px; background:var(--surface); border:1px solid var(--primary); border-radius:10px; flex-wrap:wrap; }
.batch-bar.hidden { display:none; }
#batch-count { font-weight:600; font-size:13px; margin-right:auto; color:var(--primary); }
.batch-bar .btn-ghost { padding:6px 10px; font-size:12px; }
.row-check { width:18px; height:18px; cursor:pointer; accent-color:var(--primary); flex-shrink:0; }
.item-row.selected-row { background:rgba(var(--primary-rgb),.08); border-color:var(--primary); }

.items-list { display:flex; flex-direction:column; gap:8px; }
.item-row { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; cursor:pointer; transition:background .15s,border-color .15s; }
.item-row:hover { background:var(--surface2); border-color:var(--primary); }
.item-row.pinned-row { border-color:var(--accent); }
.row-icon { width:38px; height:38px; border-radius:9px; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:18px; flex-shrink:0; overflow:hidden; }
.row-icon img { width:100%; height:100%; object-fit:cover; border-radius:9px; }
.row-info { flex:1; min-width:0; }
.row-title { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-meta { font-size:11px; color:var(--muted); margin-top:2px; }
.row-actions { display:flex; gap:4px; }
.row-actions button { width:30px; height:30px; border-radius:7px; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:13px; }
.row-actions button:hover { background:var(--surface); color:var(--text); }
.row-actions button.pinned { color:var(--accent); }
.row-actions button.danger:hover { color:var(--danger); }

.dashboard { max-width:1200px; margin:0 auto; }
.dash-header { margin-bottom:24px; }
.dash-header h1 { font-size:24px; font-weight:700; margin-bottom:4px; }
.dash-header p { color:var(--muted); font-size:14px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:20px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; align-items:center; gap:14px; transition:transform .15s, box-shadow .15s; }
.stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.stat-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; color:#fff; }
.stat-folders { background:linear-gradient(135deg, #6366f1, #8b5cf6); }
.stat-docs { background:linear-gradient(135deg, #06b6d4, #3b82f6); }
.stat-files { background:linear-gradient(135deg, #10b981, #14b8a6); }
.stat-pinned { background:linear-gradient(135deg, #f59e0b, #ef4444); }
.stat-value { font-size:22px; font-weight:700; line-height:1.2; }
.stat-label { font-size:12px; color:var(--muted); margin-top:2px; }
.dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
@media (max-width:800px) { .dash-grid { grid-template-columns:1fr; } }
.dash-panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; }
.dash-panel h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; font-weight:700; }
.type-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; }
.type-icon { width:24px; font-size:14px; text-align:center; color:var(--primary); }
.type-name { flex:1; }
.type-count { color:var(--muted); font-size:12px; font-weight:600; }
.type-bar { width:60px; height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.type-bar-fill { height:100%; background:linear-gradient(90deg, var(--primary), var(--accent)); border-radius:3px; transition:width .3s; }
.dash-item { display:flex; align-items:center; gap:10px; padding:10px; border-radius:8px; cursor:pointer; transition:background .15s; font-size:13px; margin-bottom:2px; }
.dash-item:hover { background:var(--surface2); }
.dash-item-icon { width:32px; height:32px; border-radius:8px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--primary); flex-shrink:0; overflow:hidden; }
.dash-item-icon img { width:100%; height:100%; object-fit:cover; }
.dash-item-info { flex:1; min-width:0; }
.dash-item-title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dash-item-meta { font-size:11px; color:var(--muted); margin-top:1px; }
.dash-empty { text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; }
.dash-empty i { font-size:32px; opacity:.35; margin-bottom:10px; display:block; }

.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state i { font-size:52px; opacity:.35; margin-bottom:16px; display:block; }
.empty-state h3 { font-size:17px; margin-bottom:6px; color:var(--text); }

.overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .15s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.editor-shell { width:100%; max-width:1000px; height:92vh; background:var(--surface); border-radius:16px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.35); position:relative; }
.editor-header { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--surface); z-index:10; }
.editor-title { flex:1; background:none; border:none; outline:none; font-size:17px; font-weight:700; color:var(--text); }

.editor-toolbar { display:flex; align-items:center; gap:2px; padding:6px 12px; border-bottom:1px solid var(--border); background:var(--surface2); flex-shrink:0; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; -webkit-overflow-scrolling:touch; }
.editor-toolbar::-webkit-scrollbar { height:6px; }
.editor-toolbar button { min-width:32px; height:32px; padding:0 8px; border-radius:6px; color:var(--text); display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; transition:background .12s,color .12s; flex-shrink:0; white-space:nowrap; }
.editor-toolbar button:hover { background:var(--surface); }
.editor-toolbar button.active { background:var(--primary); color:var(--primary-text); }
.editor-toolbar button.copy-btn { color:var(--success); }
.editor-toolbar button.copy-btn:hover { background:rgba(16,185,129,.12); }
.editor-toolbar button.md-btn { color:#0ea5e9; }
.editor-toolbar button.md-btn:hover { background:rgba(14,165,233,.12); }
.tb-divider { width:1px; height:20px; background:var(--border); margin:0 5px; flex-shrink:0; }
.editor-toolbar .tb-select { height:32px; padding:0 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12px; cursor:pointer; flex-shrink:0; }

.editor-body { flex:1; overflow-y:auto; padding:32px 48px 100px; }
.editor-content { max-width:760px; margin:0 auto; outline:none; min-height:100%; font-size:15px; line-height:1.75; color:var(--text); }
.editor-content h1 { font-size:28px; margin:20px 0 12px; }
.editor-content h2 { font-size:22px; margin:18px 0 10px; }
.editor-content h3 { font-size:18px; margin:16px 0 8px; }
.editor-content p { margin:10px 0; }
.editor-content ul, .editor-content ol { margin:10px 0 10px 28px; }
.editor-content a { color:var(--primary); }
.editor-content img { max-width:100%; border-radius:8px; margin:10px 0; }
.editor-content blockquote { border-left:4px solid var(--primary); padding-left:14px; margin:12px 0; color:var(--muted); font-style:italic; }
.editor-content pre { background:var(--surface2); padding:12px 16px; border-radius:8px; font-family:'Courier New',monospace; font-size:14px; overflow-x:auto; margin:10px 0; }
.editor-content code { background:var(--surface2); padding:2px 6px; border-radius:4px; font-family:'Courier New','Menlo',monospace; font-size:.9em; color:var(--danger); border:1px solid transparent; transition:border-color .15s,background .15s; cursor:text; }
.editor-content code:hover { border-color:var(--primary); background:rgba(var(--primary-rgb),.06); }
.editor-content table { border-collapse:collapse; margin:12px 0; width:100%; table-layout:fixed; }
.editor-content table td, .editor-content table th { border:1px solid var(--border); padding:8px 12px; min-width:40px; vertical-align:top; }
.editor-content table td:empty::after { content:'\00a0'; }
.editor-content hr { border:none; border-top:2px solid var(--border); margin:18px 0; }

.code-hover-copy { position:fixed; width:26px; height:26px; border-radius:6px; background:var(--primary); color:var(--primary-text); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25); z-index:700; transition:transform .1s,opacity .15s; user-select:none; }
.code-hover-copy:hover { transform:scale(1.12); }
.code-hover-copy.hidden { display:none; }

.save-fab { position:absolute; bottom:20px; right:20px; width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 6px 20px rgba(var(--primary-rgb),.4), 0 2px 6px rgba(0,0,0,.15); cursor:pointer; transition:transform .15s, box-shadow .2s, background .2s; z-index:20; }
.save-fab:hover { transform:scale(1.08); }
.save-fab:active { transform:scale(.95); }
.save-fab.has-changes { animation:fabPulse 2s infinite; }
.save-fab.saving { background:linear-gradient(135deg, #64748b, #475569); }
.save-fab.saved { background:linear-gradient(135deg, #10b981, #059669); }
@keyframes fabPulse {
  0%, 100% { box-shadow:0 6px 20px rgba(var(--primary-rgb),.4), 0 2px 6px rgba(0,0,0,.15); }
  50% { box-shadow:0 6px 20px rgba(var(--primary-rgb),.7), 0 0 0 8px rgba(var(--primary-rgb),.15); }
}

.floating-toolbar { position:fixed; z-index:600; display:flex; flex-direction:column; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:5px; box-shadow:0 8px 30px rgba(0,0,0,.25); animation:ftPop .15s ease; max-height:calc(100vh - 24px); overflow-y:auto; }
@keyframes ftPop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
.floating-toolbar button { width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:13px; transition:background .12s; flex-shrink:0; }
.floating-toolbar button:hover { background:var(--surface2); }
.floating-toolbar button.active { background:var(--primary); color:var(--primary-text); }
.floating-toolbar button.copy-btn { color:var(--success); }
.floating-toolbar button.copy-btn:hover { background:rgba(16,185,129,.12); }
.floating-toolbar button.md-btn { color:#0ea5e9; }
.floating-toolbar button.md-btn:hover { background:rgba(14,165,233,.12); }
.floating-toolbar .ft-select { width:50px; height:32px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:10px; cursor:pointer; flex-shrink:0; padding:0 2px; text-align:center; }
.ft-divider { width:22px; height:1px; background:var(--border); margin:3px auto; flex-shrink:0; }

.settings-box { width:100%; max-width:640px; max-height:88vh; overflow-y:auto; background:var(--surface); border-radius:16px; padding:28px; box-shadow:0 24px 60px rgba(0,0,0,.3); }
.settings-box h2 { font-size:20px; margin-bottom:6px; }
.settings-box .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
.setting-group { margin-bottom:18px; }
.setting-group label { display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
.setting-input { width:100%; padding:12px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; outline:none; }
.setting-input:focus { border-color:var(--primary); }
.setting-actions { display:flex; gap:8px; flex-wrap:wrap; }
.users-list { display:flex; flex-direction:column; gap:8px; }
.user-row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface2); border-radius:9px; font-size:13px; }
.user-row .avatar { width:28px; height:28px; font-size:12px; }
.user-row .role-badge { padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; background:var(--primary); color:var(--primary-text); }
.user-row .role-badge.viewer { background:var(--muted); }
.user-row .role-badge.editor { background:var(--accent); }
.user-row .user-actions { margin-left:auto; display:flex; gap:4px; }

.app-icon-preview { width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; box-shadow:0 4px 12px rgba(var(--primary-rgb),.3); overflow:hidden; }
.app-icon-preview img { width:70%; height:70%; object-fit:contain; }

.dialog-box { width:100%; max-width:400px; background:var(--surface); border-radius:16px; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.3); animation:popIn .2s; }
@keyframes popIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
.dialog-box h3 { font-size:17px; margin-bottom:14px; }
.dialog-box .dialog-message { color:var(--muted); font-size:14px; line-height:1.5; }
.dialog-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
.dialog-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:14px; }
.dialog-icon.warn { background:rgba(239,68,68,.15); color:var(--danger); }

.folder-dialog { max-width:480px; }
.emoji-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; padding:8px; background:var(--surface2); border-radius:10px; max-height:180px; overflow-y:auto; }
.emoji-item { aspect-ratio:1; border-radius:6px; font-size:20px; display:flex; align-items:center; justify-content:center; transition:background .1s, transform .1s; cursor:pointer; }
.emoji-item:hover { background:var(--surface); transform:scale(1.15); }
.emoji-item.active { background:var(--primary); box-shadow:0 0 0 2px var(--surface); }
.folder-preview { display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface2); border-radius:10px; margin:14px 0 0; }
.folder-preview-icon { font-size:32px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:var(--surface); border-radius:10px; flex-shrink:0; }
.folder-preview-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.folder-preview-parent { font-size:11px; color:var(--muted); margin-top:2px; }

.upload-box { width:100%; max-width:520px; background:var(--surface); border-radius:16px; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:16px; max-height:85vh; }
.upload-head { display:flex; align-items:center; gap:12px; }
.upload-spinner { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; flex-shrink:0; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(var(--primary-rgb),.5); } 50% { box-shadow:0 0 0 10px rgba(var(--primary-rgb),0); } }
.upload-title { font-size:15px; font-weight:700; }
.upload-subtitle { font-size:12px; color:var(--muted); margin-top:2px; }
.upload-list { display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:400px; }
.upload-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface2); border-radius:10px; }
.upload-item-icon { width:32px; height:32px; border-radius:8px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:14px; flex-shrink:0; }
.upload-item-info { flex:1; min-width:0; }
.upload-item-name { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:4px; }
.progress-bar { width:100%; height:4px; background:var(--surface); border-radius:8px; overflow:hidden; }
.progress-fill { height:100%; width:0%; border-radius:8px; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width .2s; }
.upload-item-status { width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.upload-item-status.done { color:var(--success); }
.upload-item-status.error { color:var(--danger); }
.upload-item-status.uploading { color:var(--primary); }
.upload-actions { display:flex; gap:8px; justify-content:flex-end; }

#toasts { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
.toast { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); font-size:13px; min-width:250px; transform:translateX(120%); transition:transform .3s; pointer-events:auto; }
.toast.show { transform:none; }
.toast i { font-size:16px; }
.toast-info i { color:var(--primary); }
.toast-success i { color:var(--success); }
.toast-error i { color:var(--danger); }
.toast-warning i { color:var(--warning); }

.theme-popover { position:fixed; top:60px; right:20px; z-index:100; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); width:300px; }

.theme-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px; }
.theme-swatch { height:34px; border-radius:8px; cursor:pointer; border:2px solid transparent; transition:transform .1s; }

}

  set(k, v) {
    try { localStorage.setItem(k, v); } catch {}
    try { sessionStorage.setItem(k, v); } catch {}
    try {
      let obj = {};
      if (window.name && window.name.startsWith('dv_store:')) {
        try { obj = JSON.parse(window.name.slice(9)); } catch {}
      }
      obj[k] = v;
      window.name = 'dv_store:' + JSON.stringify(obj);
    } catch {}
    this.mem[k] = v;
  },
  remove(k) {
    try { localStorage.removeItem(k); } catch {}
    try { sessionStorage.removeItem(k); } catch {}
    try {
      if (window.name && window.name.startsWith('dv_store:')) {
        const obj = JSON.parse(window.name.slice(9));
        delete obj[k];
        window.name = 'dv_store:' + JSON.stringify(obj);
      }
    } catch {}
    delete this.mem[k];
  }
};

const DEFAULT_APP_ICON = '📦';

function openFolderModal({ mode = 'create', folderId = null, parentId = null } = {}) {
  folderModalMode = mode;
  folderModalEditId = mode === 'edit' ? folderId : null;
  const isEdit = mode === 'edit';
  const folder = isEdit ? state.folders.find(f => f.id === folderId) : null;
  document.getElementById('folder-modal-title').textContent = isEdit ? 'Ubah Folder' : 'Folder Baru';
  document.getElementById('folder-name').value = folder?.name || '';
  document.getElementById('folder-emoji').value = folder?.emoji || '📁';
  const sel = document.getElementById('folder-parent');
  sel.innerHTML = '';
  const selectedParent = isEdit ? (folder?.parent_id || '') : (parentId || state.currentFolder || '');
  const excludeIds = isEdit ? new Set([folderId, ...getDescendantIds(folderId)]) : new Set();
  const rootOpt = document.createElement('option');
  rootOpt.value = ''; rootOpt.textContent = '🏠 Beranda (Root)';
  sel.appendChild(rootOpt);
  (function walk(parent, depth) {
    state.folders.filter(f => (f.parent_id || null) === parent && !excludeIds.has(f.id)).forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = (depth > 0 ? '   '.repeat(depth) + '↳ ' : '') + (f.emoji || '📁') + ' ' + f.name;
      sel.appendChild(opt);
      walk(f.id, depth + 1);
    });
  })(null, 0);
  sel.value = selectedParent;
  renderEmojiGrid(folder?.emoji || '📁');
  updateFolderPreview();
  document.getElementById('folder-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('folder-name').focus(), 100);
}
function renderEmojiGrid(selected) {
  document.getElementById('emoji-grid').innerHTML = FOLDER_EMOJIS.map(e =>
    `<button type="button" class="emoji-item ${e === selected ? 'active' : ''}" data-emoji="${e}" onclick="selectEmoji('${e}')">${e}</button>`
  ).join('');

  document.getElementById('folder-emoji').value = e;
  document.querySelectorAll('#emoji-grid .emoji-item').forEach(el => el.classList.toggle('active', el.dataset.emoji === e));

}

  document.querySelectorAll('#emoji-grid .emoji-item').forEach(el => el.classList.toggle('active', el.dataset.emoji === val));

function updateFolderPreview() {
  const emoji = document.getElementById('folder-emoji').value.trim() || '📁';
  const name = document.getElementById('folder-name').value.trim() || 'Nama Folder';
  const parentId = document.getElementById('folder-parent').value;
  let parentName = 'Beranda';
  if (parentId) { const p = state.folders.find(f => f.id === parentId); if (p) parentName = `${p.emoji || '📁'} ${p.name}`; }
  document.getElementById('folder-preview-icon').textContent = emoji;
  document.getElementById('folder-preview-name').textContent = name;
  document.getElementById('folder-preview-parent').textContent = 'Di: ' + parentName;
}
function closeFolderModal() { document.getElementById('folder-modal').classList.add('hidden'); }
async function submitFolderModal() {
  const emoji = document.getElementById('folder-emoji').value.trim() || '📁';
  const name = document.getElementById('folder-name').value.trim();
  const parentId = document.getElementById('folder-parent').value || null;
  if (!name) { toast('Nama folder wajib diisi', 'warning'); document.getElementById('folder-name').focus(); return; }
  if (folderModalMode === 'edit' && folderModalEditId) {
    const { error } = await sb.from('folders').update({ name, emoji, parent_id: parentId }).eq('id', folderModalEditId);
    if (error) return toast('Gagal: ' + error.message, 'error');
    toast('Folder diperbarui', 'success');
  } else {
    const { error } = await sb.from('folders').insert({ name, emoji, parent_id: parentId, owner_id: state.user.id });
    if (error) return toast('Gagal: ' + error.message, 'error');
    toast('Folder dibuat', 'success');
  }
  document.getElementById('folder-modal').classList.add('hidden');
  await loadFolders();
  if (parentId) state.expandedFolders.add(parentId);
  saveExpanded();
  renderSidebar(); renderContent();
}
function getDescendantIds(folderId) {
  const result = new Set();
  const stack = [folderId];
  while (stack.length) {
    const current = stack.pop();
    state.folders.filter(f => f.parent_id === current).forEach(f => { result.add(f.id); stack.push(f.id); });
  }
  return Array.from(result);
}

  const ic = (icon || DEFAULT_APP_ICON).trim() || DEFAULT_APP_ICON;
  const isUrl = /^https?:\/\//i.test(ic);
  ['login-logo-emoji', 'brand-icon'].forEach(id => {

    if (isUrl) {
      el.innerHTML = `<img src="${esc(ic)}" alt="icon" onerror="this.replaceWith(document.createTextNode('${DEFAULT_APP_ICON}'))">`;
    } else {
      el.textContent = ic;
    }
  });
}

function openUrlSafe(url) {
  if (!url) return;
  try { const w = window.open(url, '_blank', 'noopener,noreferrer'); if (w) return; } catch {}
  try {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  } catch { askInput({ title: 'Buka URL Manual', value: url }); }
}

/* STATE */
let sb;
const state = {
  user:null, settings:{}, folders:[], documents:[],
  currentFolder:null, theme:'light-1', view:'files',
  currentDoc:null, savedRange:null, hasChanges:false,
  expandedFolders: new Set(),
  selectedItems: new Map()
};
const uploadState = { files:[], cancelled:false };

/* INIT */
window.addEventListener('DOMContentLoaded', async () => {
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  state.theme = Store.get('dv_theme') || 'light-1';
  applyTheme(state.theme);

  if (window.innerWidth > 900 && Store.get('dv_sidebar_closed') === '1') {
    document.body.classList.add('sidebar-closed');
  }
  try {
    const saved = Store.get('dv_expanded');
    if (saved) JSON.parse(saved).forEach(id => state.expandedFolders.add(id));
  } catch {}

  const cachedIcon = Store.get('dv_app_icon');
  if (cachedIcon) applyAppIcon(cachedIcon);

  const savedUser = Store.get('dv_user');
  if (savedUser) {
    try { state.user = JSON.parse(savedUser); } catch { state.user = null; }
    if (state.user) {
      try { await bootApp(); }
      catch (e) {
        console.error('Boot error:', e);
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        try { renderSidebar(); renderContent(); } catch {}
      }
    } else {
      showLogin();
    }
  } else {
    showLogin();
  }

  history.pushState({ dv: true }, '', location.href);
  window.addEventListener('popstate', () => {
    history.pushState({ dv: true }, '', location.href);
    goBack();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!document.getElementById('input-overlay').classList.contains('hidden')) closeInputModal(null);
      if (!document.getElementById('confirm-overlay').classList.contains('hidden')) closeConfirmModal(false);
      if (!document.getElementById('folder-modal').classList.contains('hidden')) closeFolderModal();
      if (!document.getElementById('move-overlay').classList.contains('hidden')) closeMoveModal();
      if (!document.getElementById('edit-user-overlay').classList.contains('hidden')) closeEditUser();
      if (!document.getElementById('editor-overlay').classList.contains('hidden')) requestCloseEditor();
      hideFloatingToolbar();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      if (!document.getElementById('editor-overlay').classList.contains('hidden')) {
        e.preventDefault(); saveDocument();
      }
    }
  });

  document.addEventListener('mousedown', (e) => {
    const tb = document.getElementById('floating-toolbar');
    const editor = document.getElementById('editor-content');
    if (!tb || tb.classList.contains('hidden')) return;
    if (tb.contains(e.target)) return;
    if (editor && editor.contains(e.target)) return;
    hideFloatingToolbar();
  });

  document.addEventListener('selectionchange', () => {
    requestAnimationFrame(() => checkFloatingToolbar());
  });

  const editor = document.getElementById('editor-content');
  if (editor) {
    editor.addEventListener('input', () => {
      state.hasChanges = true;
      document.getElementById('editor-save-fab').classList.add('has-changes');
      requestAnimationFrame(checkFloatingToolbar);
    });
    editor.addEventListener('click', () => requestAnimationFrame(checkFloatingToolbar));
    editor.addEventListener('keyup', () => requestAnimationFrame(checkFloatingToolbar));
    editor.addEventListener('focus', () => requestAnimationFrame(checkFloatingToolbar));
    editor.addEventListener('mouseup', () => requestAnimationFrame(checkFloatingToolbar));
    editor.addEventListener('blur', () => {
      setTimeout(() => {
        const tb = document.getElementById('floating-toolbar');
        const ae = document.activeElement;
        if (!tb || tb.matches(':hover')) return;
        if (ae && tb.contains(ae)) return;
        hideFloatingToolbar();
      }, 120);
    });
  }

  const editorBody = document.querySelector('.editor-body');
  if (editorBody) {
    editorBody.addEventListener('scroll', () => {
      if (!document.getElementById('floating-toolbar').classList.contains('hidden')) checkFloatingToolbar();
    });
  }
  window.addEventListener('resize', () => {
    if (!document.getElementById('floating-toolbar').classList.contains('hidden')) checkFloatingToolbar();
  });

  initCodeHoverCopy();
});

function goBack() {
  if (!document.getElementById('editor-overlay').classList.contains('hidden')) { requestCloseEditor(); return; }
  const overlayIds = ['edit-user-overlay', 'move-overlay', 'settings-overlay', 'folder-modal', 'input-overlay', 'confirm-overlay'];
  for (const id of overlayIds) {
    const el = document.getElementById(id);
    if (el && !el.classList.contains('hidden')) {
      if (id === 'edit-user-overlay') closeEditUser();
      else if (id === 'move-overlay') closeMoveModal();
      else if (id === 'settings-overlay') closeSettings();
      else if (id === 'folder-modal') closeFolderModal();
      else if (id === 'input-overlay') closeInputModal(null);
      else if (id === 'confirm-overlay') closeConfirmModal(false);
      return;
    }
  }
  if (state.view === 'files' && state.currentFolder) {
    const f = state.folders.find(x => x.id === state.currentFolder);
    if (f && f.parent_id) openFolder(f.parent_id);
    else openFolder(null);
    return;
  }
  if (state.view === 'dashboard') { openFolder(null); return; }
  toast('Sudah di Beranda', 'info');
}

/* FLOATING TOOLBAR */
function checkFloatingToolbar() {
  const editor = document.getElementById('editor-content');
  const overlay = document.getElementById('editor-overlay');
  if (!editor || !overlay || overlay.classList.contains('hidden')) return hideFloatingToolbar();
  if (editor.getAttribute('contenteditable') !== 'true') return hideFloatingToolbar();
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return hideFloatingToolbar();
  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return hideFloatingToolbar();
  let rect = range.getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)) {
    const rects = range.getClientRects();
    if (rects && rects.length) rect = rects[0];
  }
  if (!rect || (!rect.width && !rect.height)) {
    if (range.collapsed) {
      try {
        const marker = document.createElement('span');
        marker.textContent = '\u200b';
        marker.style.cssText = 'display:inline-block;width:0;height:1em;';
        range.insertNode(marker);
        rect = marker.getBoundingClientRect();
        const parent = marker.parentNode;
        parent.removeChild(marker);
        parent.normalize?.();
      } catch {}
    }
  }
  if (!rect || (!rect.width && !rect.height)) return hideFloatingToolbar();
  state.savedRange = range.cloneRange();
  showFloatingToolbar(rect);
}
function showFloatingToolbar(rect) {
  const toolbar = document.getElementById('floating-toolbar');
  toolbar.classList.remove('hidden');
  const tw = toolbar.offsetWidth || 46;
  const th = toolbar.offsetHeight || 480;
  let left = rect.right + 12;
  if (left + tw > window.innerWidth - 12) left = rect.left - tw - 12;
  if (left < 12) left = 12;
  let top = rect.top + (rect.height / 2) - (th / 2);
  if (top < 12) top = 12;
  if (top + th > window.innerHeight - 12) top = window.innerHeight - th - 12;
  toolbar.style.left = left + 'px';
  toolbar.style.top = top + 'px';
  updateToolbarState();
}
function hideFloatingToolbar() {
  document.getElementById('floating-toolbar').classList.add('hidden');
}

/* CODE HOVER COPY */
function initCodeHoverCopy() {
  const editor = document.getElementById('editor-content');
  const btn = document.getElementById('code-hover-copy');
  if (!editor || !btn) return;
  let currentCode = null;
  let hideTimer = null;
  editor.addEventListener('mousemove', (e) => {
    const code = e.target.closest && e.target.closest('code');
    if (code && editor.contains(code)) {
      currentCode = code;
      clearTimeout(hideTimer);
      const rect = code.getBoundingClientRect();
      btn.classList.remove('hidden');
      btn.style.left = Math.min(rect.right + 6, window.innerWidth - 32) + 'px';
      btn.style.top = (rect.top - 2) + 'px';
    } else if (!btn.contains(e.target)) {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!btn.matches(':hover')) { btn.classList.add('hidden'); currentCode = null; }
      }, 150);
    }
  });
  editor.addEventListener('mouseleave', () => {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { if (!btn.matches(':hover')) btn.classList.add('hidden'); }, 150);
  });
  btn.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  btn.addEventListener('mouseleave', () => { btn.classList.add('hidden'); currentCode = null; });
  btn.addEventListener('click', async () => {
    if (!currentCode) return;
    try {
      await navigator.clipboard.writeText(currentCode.textContent);
      toast('Kode disalin: ' + currentCode.textContent.slice(0, 40), 'success');
      btn.classList.add('hidden');
    } catch (err) { toast('Gagal copy: ' + err.message, 'error'); }
  });
}

/* BOOT */
async function requestCloseEditor() {
  if (state.hasChanges) {
    const ok = await askConfirm('Tutup editor? Perubahan yang belum disimpan akan hilang.', { title: 'Tutup Editor' });
    if (!ok) return;
  }
  closeEditor();
}
function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  loadLoginBranding();
}
async function loadLoginBranding() {
  try {
    const { data } = await sb.from('settings').select('*');
    const map = {};
    (data||[]).forEach(s => map[s.key] = s.value);
    if (map.app_name) document.getElementById('login-app-name').textContent = map.app_name;
    if (map.app_icon) applyAppIcon(map.app_icon);
  } catch {}
}
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Memeriksa...';
  try {
    const { data, error } = await sb.from('users').select('*').eq('username', user).eq('password', pass).maybeSingle();
    if (error) throw error;
    if (!data) { errEl.textContent = 'Username atau password salah.'; return; }
    state.user = data;
    Store.set('dv_user', JSON.stringify(data));
    await bootApp();
  } catch (err) {
    errEl.textContent = 'Gagal terhubung. Cek konfigurasi Supabase.';
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Masuk</span><i class="fa fa-arrow-right"></i>';
  }
}

async function bootApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-name').textContent = state.user.username;
  document.getElementById('user-avatar').textContent = state.user.username[0].toUpperCase();
  try { await loadSettings(); } catch (e) { console.warn('Settings:', e); }
  try { await loadFolders(); } catch (e) { console.warn('Folders:', e); }
  try { await loadDocuments(); } catch (e) { console.warn('Docs:', e); }
  const savedView = Store.get('dv_view');
  if (savedView === 'dashboard') {
    state.view = 'dashboard';
  } else {
    state.view = 'files';
    const savedFolder = Store.get('dv_folder');
    if (savedFolder && state.folders.some(f => f.id === savedFolder)) {
      state.currentFolder = savedFolder;
      expandAncestors(savedFolder);
    } else {
      state.currentFolder = null;
      Store.remove('dv_folder');
    }
  }
  renderSidebar();
  renderContent();
}

async function loadSettings() {
  const { data, error } = await sb.from('settings').select('*');
  if (error) throw error;
  state.settings = {};
  (data||[]).forEach(s => state.settings[s.key] = s.value);
  const appName = state.settings.app_name || 'DocuVault';
  const appIcon = state.settings.app_icon || DEFAULT_APP_ICON;
  document.getElementById('brand-name').textContent = appName;
  document.getElementById('login-app-name').textContent = appName;
  document.title = appName;
  applyAppIcon(appIcon);
  Store.set('dv_app_icon', appIcon);
}
async function loadFolders() {
  const { data, error } = await sb.from('folders').select('*').order('created_at');
  if (error) throw error;
  state.folders = data || [];
}
async function loadDocuments() {
  const { data, error } = await sb.from('documents').select('*').order('updated_at', { ascending:false });
  if (error) throw error;
  state.documents = data || [];
}

/* SIDEBAR */
function toggleSidebar() {
  if (window.innerWidth <= 900) document.getElementById('sidebar').classList.toggle('open');
  else {
    document.body.classList.toggle('sidebar-closed');
    Store.set('dv_sidebar_closed', document.body.classList.contains('sidebar-closed') ? '1' : '0');
  }
}
function renderSidebar() {
  document.getElementById('nav-dashboard').classList.toggle('active', state.view === 'dashboard');
  document.getElementById('nav-home').classList.toggle('active', state.view === 'files' && !state.currentFolder);
  document.getElementById('folder-tree').innerHTML = renderTree(null, 0);
}
function renderTree(parentId, depth) {
  const children = state.folders.filter(f => (f.parent_id||null) === parentId);
  if (!children.length) return '';
  const isAdmin = state.user.role === 'admin';
  return children.map(f => {
    const hasKids = state.folders.some(x => x.parent_id === f.id);
    const isExpanded = state.expandedFolders.has(f.id);
    const active = state.view === 'files' && state.currentFolder === f.id ? 'active' : '';
    const chevron = hasKids
      ? `<button class="chevron-btn" onclick="toggleFolderExpand('${f.id}', event)"><i class="fa fa-chevron-${isExpanded?'down':'right'}"></i></button>`
      : `<span class="chevron-spacer"></span>`;
    return `
      <div class="folder-item ${active}" style="padding-left:${8 + depth*14}px" onclick="openFolder('${f.id}')">
        ${chevron}
        <span class="folder-emoji">${f.emoji || '📁'}</span>
        <span class="fname">${esc(f.name)}</span>
        ${f.is_pinned?'<i class="fa fa-thumbtack pin-badge"></i>':''}
        <div class="folder-actions" onclick="event.stopPropagation()">
          <button onclick="createSubfolder('${f.id}')" title="Sub folder"><i class="fa fa-plus"></i></button>
          ${isAdmin ? `<button onclick="togglePinFolder('${f.id}')" title="Sematkan"><i class="fa fa-thumbtack"></i></button>` : ''}
          <button onclick="renameFolder('${f.id}')" title="Ubah"><i class="fa fa-pen"></i></button>
          ${isAdmin ? `<button onclick="deleteFolder('${f.id}')" title="Hapus"><i class="fa fa-trash"></i></button>` : ''}
        </div>
      </div>
      ${hasKids && isExpanded ? renderTree(f.id, depth+1) : ''}
    `;
  }).join('');
}
function toggleFolderExpand(id, event) {
  if (event) event.stopPropagation();
  if (state.expandedFolders.has(id)) state.expandedFolders.delete(id);
  else state.expandedFolders.add(id);
  saveExpanded();
  renderSidebar();
}
function saveExpanded() { Store.set('dv_expanded', JSON.stringify([...state.expandedFolders])); }
function expandAncestors(folderId) {
  let cur = folderId;
  while (cur) {
    state.expandedFolders.add(cur);
    const f = state.folders.find(x => x.id === cur);
    cur = f?.parent_id;
  }
  saveExpanded();
}

/* VIEWS */
function showDashboard() {
  state.view = 'dashboard';
  Store.set('dv_view', 'dashboard');
  state.selectedItems.clear();
  renderSidebar();
  renderContent();
  if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');
}
function openFolder(id) {
  state.view = 'files';
  Store.set('dv_view', 'files');
  state.currentFolder = id;
  state.selectedItems.clear();
  if (id) { Store.set('dv_folder', id); expandAncestors(id); }
  else { Store.remove('dv_folder'); }
  renderSidebar(); renderContent();
  if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');
}

/* CONTENT */
function getFolderPath(id) {
  const path = [];
  let cur = id;
  while (cur) {
    const f = state.folders.find(x => x.id === cur);
    if (!f) break;
    path.unshift(f);
    cur = f.parent_id;
  }
  return path;
}
function renderContent() {
  if (state.view === 'dashboard') return renderDashboard();
  renderFilesView();
}
function renderDashboard() {
  const content = document.getElementById('content');
  const totalFolders = state.folders.length;
  const totalDocs = state.documents.length;
  const files = state.documents.filter(d => d.file_url);
  const pinnedItems = [...state.folders.filter(f => f.is_pinned), ...state.documents.filter(d => d.is_pinned)];
  const typeMap = {
    image: { label: 'Gambar', icon: 'fa-image', filter: d => isImageType(d.file_type, d.file_name) },
    pdf: { label: 'PDF', icon: 'fa-file-pdf', filter: d => d.file_type === 'application/pdf' || /\.pdf$/i.test(d.file_name || '') },
    doc: { label: 'Dokumen', icon: 'fa-file-word', filter: d => /\.(docx?)$/i.test(d.file_name || '') || /word/.test(d.file_type || '') },
    sheet: { label: 'Spreadsheet', icon: 'fa-file-excel', filter: d => /\.(xlsx?|csv)$/i.test(d.file_name || '') || /sheet/.test(d.file_type || '') },
    video: { label: 'Video', icon: 'fa-file-video', filter: d => (d.file_type || '').startsWith('video/') },
    audio: { label: 'Audio', icon: 'fa-file-audio', filter: d => (d.file_type || '').startsWith('audio/') },
    archive: { label: 'Arsip', icon: 'fa-file-archive', filter: d => /\.(zip|rar|7z)$/i.test(d.file_name || '') },
  };
  const fileStats = Object.entries(typeMap).map(([k, v]) => ({
    key: k, ...v, count: files.filter(v.filter).length
  })).filter(t => t.count > 0);
  const maxCount = Math.max(1, ...fileStats.map(t => t.count));
  const recent = state.documents.slice(0, 8);
  const pinnedList = pinnedItems.slice(0, 8);

  content.innerHTML = `
    <div class="dashboard">
      <div class="dash-header"><h1>Dashboard</h1><p>Ringkasan semua berkas Anda</p></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-icon stat-folders"><i class="fa fa-folder"></i></div><div><div class="stat-value">${totalFolders}</div><div class="stat-label">Total Folder</div></div></div>
        <div class="stat-card"><div class="stat-icon stat-docs"><i class="fa fa-file-lines"></i></div><div><div class="stat-value">${totalDocs}</div><div class="stat-label">Total Dokumen</div></div></div>
        <div class="stat-card"><div class="stat-icon stat-files"><i class="fa fa-cloud"></i></div><div><div class="stat-value">${files.length}</div><div class="stat-label">File Terunggah</div></div></div>
        <div class="stat-card"><div class="stat-icon stat-pinned"><i class="fa fa-thumbtack"></i></div><div><div class="stat-value">${pinnedItems.length}</div><div class="stat-label">Disematkan</div></div></div>
      </div>
      <div class="dash-grid">
        <div class="dash-panel">
          <h3>Tipe File</h3>
          ${fileStats.length ? fileStats.map(t => `
            <div class="type-row">
              <i class="fa ${t.icon} type-icon"></i>
              <span class="type-name">${t.label}</span>
              <span class="type-count">${t.count}</span>
              <div class="type-bar"><div class="type-bar-fill" style="width:${(t.count/maxCount)*100}%"></div></div>
            </div>
          `).join('') : `<div class="dash-empty"><i class="fa fa-chart-bar"></i>Belum ada file terunggah</div>`}
        </div>
        <div class="dash-panel">
          <h3>Disematkan</h3>
          ${pinnedList.length ? pinnedList.map(item => {
            const isFolder = state.folders.some(f => f.id === item.id);
            if (isFolder) {
              return `<div class="dash-item" onclick="openFolder('${item.id}')">
                <div class="dash-item-icon" style="font-size:16px">${item.emoji || '📁'}</div>
                <div class="dash-item-info"><div class="dash-item-title">${esc(item.name)}</div><div class="dash-item-meta">Folder</div></div>
              </div>`;
            }
            const isImg = isImageType(item.file_type, item.file_name);
            return `<div class="dash-item" onclick="openDocument('${item.id}')">
              <div class="dash-item-icon">${isImg ? `<img src="${item.file_url}" onerror="this.parentNode.innerHTML='<i class=\\'fa fa-image\\'></i>'">` : `<i class="fa ${iconFor(item.file_type, item.file_name)}"></i>`}</div>
              <div class="dash-item-info"><div class="dash-item-title">${esc(item.title)}</div><div class="dash-item-meta">${item.file_name ? esc(item.file_name) : 'Dokumen'}</div></div>
            </div>`;
          }).join('') : `<div class="dash-empty"><i class="fa fa-thumbtack"></i>Belum ada yang disematkan</div>`}
        </div>
      </div>
      <div class="dash-panel">
        <h3>Terbaru</h3>
        ${recent.length ? recent.map(item => {
          const isImg = isImageType(item.file_type, item.file_name);
          return `<div class="dash-item" onclick="openDocument('${item.id}')">
            <div class="dash-item-icon">${isImg ? `<img src="${item.file_url}" onerror="this.parentNode.innerHTML='<i class=\\'fa fa-image\\'></i>'">` : `<i class="fa ${iconFor(item.file_type, item.file_name)}"></i>`}</div>
            <div class="dash-item-info"><div class="dash-item-title">${esc(item.title)}</div><div class="dash-item-meta">${item.file_name ? esc(item.file_name) : 'Dokumen'} · ${new Date(item.updated_at).toLocaleDateString('id-ID')}</div></div>
          </div>`;
        }).join('') : `<div class="dash-empty"><i class="fa fa-folder-open"></i>Belum ada dokumen</div>`}
      </div>
    </div>
  `;
}
function renderFilesView() {
  const content = document.getElementById('content');
  const path = getFolderPath(state.currentFolder);
  const canEdit = state.user.role !== 'viewer';
  const isAdmin = state.user.role === 'admin';
  const breadcrumb = `
    <a onclick="openFolder(null)">🏠 Beranda</a>
    ${path.map(f => `<span class="sep">/</span><a onclick="openFolder('${f.id}')">${f.emoji || '📁'} ${esc(f.name)}</a>`).join('')}
    ${path.length ? '' : '<span class="current" style="margin-left:6px">Semua Berkas</span>'}
  `;
  content.innerHTML = `
    <div class="content-header">
      <div class="breadcrumb">${breadcrumb}</div>
      <div class="header-actions">
        ${canEdit ? `
          <button class="btn-ghost" onclick="uploadFile()"><i class="fa fa-cloud-upload-alt"></i> Upload</button>

        ` : ''}

    </div>
    ${isAdmin ? `
    <div class="batch-bar hidden" id="batch-bar">
      <span id="batch-count">0 dipilih</span>
      <button class="btn-ghost" onclick="selectAllItems()"><i class="fa fa-check-square"></i> Pilih semua</button>
      <button class="btn-ghost" onclick="clearSelection()"><i class="fa fa-times"></i> Batal</button>
      <button class="btn-ghost" onclick="openMoveModal()"><i class="fa fa-folder-open"></i> Pindah</button>
      <button class="btn-ghost" onclick="deleteSelected()" style="color:var(--danger);border-color:var(--danger)"><i class="fa fa-trash"></i> Hapus</button>
    </div>` : ''}
    <div id="items-container"></div>
  `;
  renderItems();
  updateBatchBar();
}
function currentItems() {
  const folders = state.folders.filter(f => (f.parent_id||null) === state.currentFolder);
  const docs = state.documents.filter(d => (d.folder_id||null) === state.currentFolder);
  folders.sort((a,b) => (b.is_pinned?1:0) - (a.is_pinned?1:0));
  docs.sort((a,b) => (b.is_pinned?1:0) - (a.is_pinned?1:0));
  return { folders, docs };
}
function renderItems() {
  const { folders, docs } = currentItems();
  const container = document.getElementById('items-container');
  if (!container) return;
  if (!folders.length && !docs.length) {
    container.innerHTML = `<div class="empty-state"><i class="fa fa-folder-open"></i><h3>Belum ada berkas</h3><p>Mulai dengan membuat folder atau mengunggah dokumen.</p></div>`;
    return;
  }
  container.innerHTML = '<div class="items-list"></div>';
  const list = container.querySelector('.items-list');
  folders.forEach(f => list.appendChild(folderRow(f)));
  docs.forEach(d => list.appendChild(docRow(d)));
}
function folderRow(f) {

  div.className = 'item-row' + (f.is_pinned?' pinned-row':'') + (isSelected('folder', f.id) ? ' selected-row' : '');

    ${isAdmin ? `<input type="checkbox" class="row-check" ${isSelected('folder', f.id) ? 'checked' : ''} onclick="event.stopPropagation();toggleSelect('folder','${f.id}')" title="Pilih">` : ''}

      <div class="row-title">${esc(f.name)}</div>

function docRow(d) {
  const div = document.createElement('div');
  const isAdmin = state.user.role === 'admin';
  div.className = 'item-row' + (d.is_pinned?' pinned-row':'') + (isSelected('doc', d.id) ? ' selected-row' : '');
  const isImg = isImageType(d.file_type, d.file_name);
  div.innerHTML = `
    ${isAdmin ? `<input type="checkbox" class="row-check" ${isSelected('doc', d.id) ? 'checked' : ''} onclick="event.stopPropagation();toggleSelect('doc','${d.id}')" title="Pilih">` : ''}
    <div class="row-icon">${isImg ? `<img src="${d.file_url}" loading="lazy" onerror="this.parentNode.innerHTML='<i class=\\'fa fa-image\\'></i>'">` : `<i class="fa ${iconFor(d.file_type,d.file_name)}"></i>`}</div>
    <div class="row-info">
      <div class="row-title">${esc(d.title)}</div>
      <div class="row-meta">${d.file_name ? esc(d.file_name) : 'Dokumen'} · ${new Date(d.updated_at).toLocaleDateString('id-ID')}</div>
    </div>
    <div class="row-actions">
      ${isAdmin ? `<button class="${d.is_pinned?'pinned':''}" onclick="event.stopPropagation();togglePinDoc('${d.id}')" title="Sematkan"><i class="fa fa-thumbtack"></i></button>` : ''}

      ${isAdmin ? `<button class="danger" onclick="event.stopPropagation();deleteDocument('${d.id}')" title="Hapus"><i class="fa fa-trash"></i></button>` : ''}
    </div>
  `;
  div.onclick = () => openDocument(d.id);

/* Open file in Google Drive viewer */
function openDocFile(id) {

/* FOLDER ACTIONS */
function createFolder(parentId = null) {
  if (state.user.role === 'viewer') return toast('Anda hanya bisa melihat','warning');
  openFolderModal({ mode: 'create', parentId });
}
function createSubfolder(parentId) { createFolder(parentId); }
function renameFolder(id) {
  if (state.user.role === 'viewer') return toast('Anda hanya bisa melihat','warning');
  openFolderModal({ mode: 'edit', folderId: id });
}
async function deleteFolder(id) {
  if (state.user.role !== 'admin') return toast('Hanya admin yang bisa menghapus','error');
  const ok = await askConfirm('Hapus folder beserta isinya? Tindakan ini tidak bisa dibatalkan.', { title: 'Hapus Folder' });
  if (!ok) return;
  const { error } = await sb.from('folders').delete().eq('id', id);
  if (error) return toast('Gagal', 'error');
  if (state.currentFolder === id) { state.currentFolder = null; Store.remove('dv_folder'); }
  await loadFolders(); await loadDocuments();
  renderSidebar(); renderContent();
  toast('Folder dihapus', 'success');

/* FORMATTING */
function exec(cmd, arg) {
  const editor = document.getElementById('editor-content');
  const sel = window.getSelection();
  if ((!sel.rangeCount || sel.isCollapsed) && state.savedRange) {
    sel.removeAllRanges();
    sel.addRange(state.savedRange);
  }
  try { editor.focus({ preventScroll: true }); } catch { editor.focus(); }
  document.execCommand(cmd, false, arg);
  updateToolbarState();
  setTimeout(checkFloatingToolbar, 60);
}
function applyInlineCode() {
  const editor = document.getElementById('editor-content');
  const sel = window.getSelection();
  if ((!sel.rangeCount || sel.isCollapsed) && state.savedRange) {
    sel.removeAllRanges();
    sel.addRange(state.savedRange);
  }
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  let cur = range.commonAncestorContainer;
  while (cur && cur !== editor) {
    if (cur.nodeType === 1 && cur.tagName === 'CODE') {
      const parent = cur.parentNode;
      while (cur.firstChild) parent.insertBefore(cur.firstChild, cur);
      parent.removeChild(cur);
      parent.normalize();
      setTimeout(checkFloatingToolbar, 60);
      return;
    }
    cur = cur.parentNode;
  }
  const code = document.createElement('code');
  try { range.surroundContents(code); }
  catch {
    const contents = range.extractContents();
    code.appendChild(contents);
    range.insertNode(code);
  }
  try { editor.focus({ preventScroll: true }); } catch { editor.focus(); }
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(code);
  sel.addRange(newRange);
  state.savedRange = newRange.cloneRange();
  setTimeout(checkFloatingToolbar, 60);
}
function insertTable(rows = 3, cols = 3) {
  const editor = document.getElementById('editor-content');
  const sel = window.getSelection();
  if (state.savedRange && (!sel.rangeCount || !editor.contains(sel.anchorNode))) {
    sel.removeAllRanges(); sel.addRange(state.savedRange);
  }
  let html = '<table><tbody>';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) html += '<td><br></td>';
    html += '</tr>';
  }
  html += '</tbody></table><p><br></p>';
  try { editor.focus({ preventScroll: true }); } catch { editor.focus(); }
  document.execCommand('insertHTML', false, html);
  state.hasChanges = true;
  document.getElementById('editor-save-fab').classList.add('has-changes');
  setTimeout(checkFloatingToolbar, 60);
}
function setLineHeight(value) {
  if (!value) return;
  const editor = document.getElementById('editor-content');
  const sel = window.getSelection();
  if (!sel.rangeCount) {
    if (state.savedRange) { sel.removeAllRanges(); sel.addRange(state.savedRange); }
    else return;
  }
  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return;
  const BLOCKS = /^(P|H[1-6]|LI|DIV|BLOCKQUOTE|TD|TH|PRE)$/i;
  const targets = [];
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_ELEMENT);
  let n;
  while ((n = walker.nextNode())) {
    if (BLOCKS.test(n.tagName) && range.intersectsNode(n)) targets.push(n);
  }
  if (!targets.length) {
    let cur = range.commonAncestorContainer;
    while (cur && cur !== editor) {
      if (cur.nodeType === 1 && BLOCKS.test(cur.tagName)) { targets.push(cur); break; }
      cur = cur.parentNode;
    }
  }
  targets.forEach(t => t.style.lineHeight = value);
  state.hasChanges = true;
  document.getElementById('editor-save-fab').classList.add('has-changes');
}

/* COPY */
async function copySelectionRich() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
    if (state.savedRange && !state.savedRange.collapsed) {
      sel.removeAllRanges(); sel.addRange(state.savedRange);
    } else return toast('Pilih teks terlebih dahulu', 'warning');
  }
  try {
    const range = sel.getRangeAt(0);
    const wrapper = document.createElement('div');
    wrapper.appendChild(range.cloneContents());
    wrapper.querySelectorAll('.code-hover-copy').forEach(b => b.remove());
    const html = wrapper.innerHTML;
    const plain = sel.toString();
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' })
      })]);
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(plain);
    } else throw new Error('Clipboard tidak tersedia');
    toast('Teks disalin (dengan format)', 'success');
  } catch (e) {
    console.warn('Rich copy gagal:', e);
    try {
      await navigator.clipboard.writeText(window.getSelection().toString());
      toast('Teks disalin (plain)', 'success');
    } catch (e2) { toast('Gagal menyalin: ' + e2.message, 'error'); }
  }
}
async function copySelectionMarkdown() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
    if (state.savedRange && !state.savedRange.collapsed) {
      sel.removeAllRanges(); sel.addRange(state.savedRange);
    } else return toast('Pilih teks terlebih dahulu', 'warning');
  }
  try {
    const range = sel.getRangeAt(0);
    const wrapper = document.createElement('div');
    wrapper.appendChild(range.cloneContents());
    wrapper.querySelectorAll('.code-hover-copy').forEach(b => b.remove());
    const md = htmlToMarkdown(wrapper).trim();
    if (!md) return toast('Tidak ada teks untuk disalin', 'warning');
    await navigator.clipboard.writeText(md);
    toast('Disalin sebagai Markdown', 'success');
  } catch (e) { toast('Gagal menyalin: ' + e.message, 'error'); }
}
function htmlToMarkdown(root) {
  function walk(node) {
    if (node.nodeType === 3) return node.textContent;
    if (node.nodeType !== 1) return '';
    const tag = node.tagName.toLowerCase();
    const children = Array.from(node.childNodes).map(n => walk(n)).join('');
    switch (tag) {
      case 'b': case 'strong': return `**${children}**`;
      case 'i': case 'em': return `*${children}*`;
      case 'u': return `<u>${children}</u>`;
      case 's': case 'strike': case 'del': return `~~${children}~~`;
      case 'code': return '`' + children + '`';
      case 'pre': return '\n```\n' + node.textContent + '\n```\n';
      case 'h1': return '\n# ' + children + '\n';
      case 'h2': return '\n## ' + children + '\n';
      case 'h3': return '\n### ' + children + '\n';
      case 'h4': return '\n#### ' + children + '\n';
      case 'a': { const href = node.getAttribute('href') || ''; return `[${children}](${href})`; }
      case 'li': return '- ' + children + '\n';
      case 'ul': return '\n' + children;
      case 'ol': { let i = 1; return '\n' + Array.from(node.children).map(li => `${i++}. ${walk(li).replace(/^- /, '').trim()}`).join('\n') + '\n'; }
      case 'blockquote': return '\n> ' + children.replace(/\n/g, '\n> ') + '\n';
      case 'br': return '\n';
      case 'p': return children + '\n\n';
      case 'div': return children + '\n';
      case 'table': {
        const rows = node.querySelectorAll('tr');
        let md = '\n';
        rows.forEach((tr, idx) => {
          const cells = Array.from(tr.children).map(td => walk(td).trim());
          md += '| ' + cells.join(' | ') + ' |\n';
          if (idx === 0) md += '|' + cells.map(() => '---').join('|') + '|\n';
        });
        return md + '\n';
      }
      case 'img': { const src = node.getAttribute('src') || ''; const alt = node.getAttribute('alt') || ''; return `![${alt}](${src})`; }
      case 'hr': return '\n---\n';
      default: return children;
    }
  }
  return walk(root);
}
