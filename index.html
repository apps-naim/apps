/* ============================================================
   UPLOAD — BATAS MAKSIMAL 300MB
   ============================================================ */
function uploadFile() {
  if (state.user.role === 'viewer') return toast('Anda hanya bisa melihat','warning');
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.onchange = () => { if (inp.files.length) doUploadMultiple(Array.from(inp.files)); };
  inp.click();
}
async function doUploadMultiple(files) {
  // ==== BATAS MAKSIMAL 300MB PER FILE ====
  const MAX_SIZE = MAX_UPLOAD_SIZE;
  const valid = files.filter(f => {
    if (f.size > MAX_SIZE) {
      toast(`"${f.name}" terlalu besar (maks ${MAX_UPLOAD_SIZE_LABEL})`, 'error');
      return false;
    }
    return true;
  });
  if (!valid.length) return;

  uploadState.files = valid.map(f => ({ file: f, id: uid(), status: 'pending', progress: 0 }));
  uploadState.cancelled = false;
  document.getElementById('upload-list').innerHTML = uploadState.files.map(u => `
    <div class="upload-item" id="up-${u.id}">
      <div class="upload-item-icon"><i class="fa ${iconFor(u.file.type, u.file.name)}"></i></div>
      <div class="upload-item-info">
        <div class="upload-item-name">${esc(u.file.name)}</div>
        <div class="progress-bar"><div class="progress-fill" id="pf-${u.id}"></div></div>
      </div>
      <div class="upload-item-status uploading" id="st-${u.id}"><i class="fa fa-clock"></i></div>
    </div>
  `).join('');
  document.getElementById('upload-overlay').classList.remove('hidden');
  document.getElementById('upload-cancel-btn').style.display = '';
  updateUploadTitle();

  // Untuk file besar, kurangi konkurensi agar tidak membebani memori & jaringan
  const CONCURRENCY = 2;
  const queue = [...uploadState.files];
  let done = 0, failed = 0;
  async function worker() {
    while (queue.length && !uploadState.cancelled) {
      const item = queue.shift();
      if (!item) break;
      try { await uploadOne(item); done++; }
      catch (e) {
        failed++; item.status = 'error';
        const st = document.getElementById('st-' + item.id);
        if (st) { st.className = 'upload-item-status error'; st.innerHTML = '<i class="fa fa-exclamation-circle"></i>'; st.title = e.message; }
      }
      updateUploadTitle(done, failed);
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, uploadState.files.length) }, worker));
  if (!uploadState.cancelled) {
    await loadDocuments();
    if (state.view === 'files') renderContent();
    document.getElementById('upload-title').textContent = 'Selesai';
    document.getElementById('upload-cancel-btn').style.display = 'none';
    setTimeout(() => {
      document.getElementById('upload-overlay').classList.add('hidden');
      if (done > 0) toast(`${done} file berhasil diunggah ✅${failed?` · ${failed} gagal`:''}`, failed ? 'warning' : 'success');
      else if (failed) toast(`${failed} file gagal diunggah`, 'error');
    }, 900);
  }
}
function updateUploadTitle(done = 0, failed = 0) {
  const total = uploadState.files.length;
  const completed = done + failed;
  document.getElementById('upload-title').textContent = uploadState.cancelled ? 'Dibatalkan' : `Mengunggah ${total} file...`;
  document.getElementById('upload-subtitle').textContent = `${completed} dari ${total} selesai${failed?` · ${failed} gagal`:''}`;
}
async function uploadOne(item) {
  if (uploadState.cancelled) throw new Error('Dibatalkan');
  const st = document.getElementById('st-' + item.id);
  const pf = document.getElementById('pf-' + item.id);
  st.className = 'upload-item-status uploading';
  st.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
  let file = item.file;
  // Kompresi hanya untuk gambar di bawah 20MB (gambar raksasa > 20MB dilewati agar tidak crash)
  if (file.type.startsWith('image/') && file.size > 500 * 1024 && file.size < 20 * 1024 * 1024) {
    try { const c = await compressImage(file); if (c.size < file.size) file = c; } catch {}
  }
  const base64 = await readAsBase64(file);
  const result = await uploadToGAS(file.name, file.type || 'application/octet-stream', base64, (pct) => {
    if (pf) pf.style.width = pct + '%';
    if (uploadState.cancelled) throw new Error('Dibatalkan');
  });
  if (!result || !result.success || !result.fileId) throw new Error(result?.error || 'Gagal upload ke Drive');
  const { error } = await sb.from('documents').insert({
    title: item.file.name, file_url: result.directUrl, file_name: item.file.name,
    file_type: item.file.type, file_size: file.size, drive_file_id: result.fileId,
    folder_id: state.currentFolder || null, owner_id: state.user.id
  });
  if (error) throw error;
  item.status = 'done';
  if (st) { st.className = 'upload-item-status done'; st.innerHTML = '<i class="fa fa-check-circle"></i>'; }
  if (pf) pf.style.width = '100%';
}
function cancelUploads() {
  uploadState.cancelled = true;
  uploadState.files.forEach(u => {
    if (u.status !== 'done') {
      const st = document.getElementById('st-' + u.id);
      if (st) { st.className = 'upload-item-status error'; st.innerHTML = '<i class="fa fa-ban"></i>'; }
    }
  });
  document.getElementById('upload-title').textContent = 'Dibatalkan';
  document.getElementById('upload-cancel-btn').style.display = 'none';
  setTimeout(() => document.getElementById('upload-overlay').classList.add('hidden'), 800);
}
function readAsBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function compressImage(file) {
  if (!file.type.startsWith('image/') || file.size < 500 * 1024) return file;
  if (file.type === 'image/svg+xml' || file.type === 'image/gif') return file;
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxDim = 2400;
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const ratio = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * ratio); height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      canvas.toBlob((blob) => {
        if (blob && blob.size < file.size) resolve(new File([blob], file.name, { type: outType }));
        else resolve(file);
      }, outType, outType === 'image/jpeg' ? 0.82 : undefined);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function uploadToGAS(fileName, mimeType, base64, onProgress) {
  const token = uid();
  const payload = JSON.stringify({ action: 'upload', fileName, mimeType, fileData: base64, token });
  try {
    onProgress(5);
    const res = await fetch(CONFIG.GAS_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload });
    if (res.ok) {
      const data = JSON.parse(await res.text());
      if (data.success && data.fileId) { onProgress(100); return data; }
    }
  } catch (e) { console.warn('Fetch CORS gagal, fallback no-cors:', e.message); }
  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', CONFIG.GAS_URL, true);
    try { xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8'); } catch {}
    // Timeout dinaikkan ke 10 menit agar file besar (300MB) tidak putus
    xhr.timeout = UPLOAD_XHR_TIMEOUT;
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.min(90, Math.round((e.loaded / e.total) * 90))); };
    xhr.onload = () => resolve(); xhr.onerror = () => resolve(); xhr.ontimeout = () => resolve();
    xhr.onabort = () => reject(new Error('Upload dibatalkan'));
    try { xhr.send(payload); } catch (e) { reject(new Error('XHR gagal: ' + e.message)); }
  });
  onProgress(92);
  // Polling diperpanjang agar file besar punya waktu lebih untuk diproses di Drive
  for (let i = 0; i < UPLOAD_POLL_ATTEMPTS; i++) {
    if (uploadState.cancelled) throw new Error('Dibatalkan');
    await new Promise(r => setTimeout(r, 1500));
    try {
      const url = `${CONFIG.GAS_URL}?action=getByToken&token=${encodeURIComponent(token)}&t=${Date.now()}`;
      const r = await fetch(url, { redirect: 'follow', cache: 'no-store' });
      if (!r.ok) continue;
      const data = await r.json();
      if (data.success && data.fileId) { onProgress(100); return data; }
    } catch {}
  }
  throw new Error('Timeout — file mungkin sudah terupload tapi respons tidak diterima.');
}
async function deleteFromGAS(fileId) {
  const url = `${CONFIG.GAS_URL}?action=delete&fileId=${encodeURIComponent(fileId)}&t=${Date.now()}`;
  try { const res = await fetch(url, { redirect: 'follow', cache: 'no-store' }); return await res.json(); }
  catch (e) { return { success: false, error: e.message }; }
}
async function testGASConnection() {
  toast('Menguji koneksi ke Google Apps Script...', 'info');
  try {
    const res = await fetch(CONFIG.GAS_URL + '?action=ping&t=' + Date.now(), { redirect: 'follow', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.success) toast('✅ GAS terhubung! ' + (data.message || ''), 'success');
    else toast('⚠ GAS merespons tapi error: ' + (data.error || '-'), 'warning');
  } catch (e) { toast('❌ GAS gagal dihubungi: ' + e.message, 'error'); }
}

/* SETTINGS */
async function openSettings() {
  const currentIcon = state.settings.app_icon || DEFAULT_APP_ICON;
  document.getElementById('set-app-name').value = state.settings.app_name || 'DocuVault';
  document.getElementById('set-app-icon').value = currentIcon;
  updateAppIconPreview();
  renderAppIconGrid(currentIcon);
  document.getElementById('set-admin-pass').value = '';
  const adminOnly = state.user.role === 'admin';
  document.getElementById('admin-only-settings').style.display = adminOnly ? '' : 'none';
  document.getElementById('user-mgmt-group').style.display = adminOnly ? '' : 'none';
  if (adminOnly) {
    const { data: users } = await sb.from('users').select('*').order('created_at');
    document.getElementById('users-list').innerHTML = (users||[]).map(u => `
      <div class="user-row">
        <div class="avatar">${u.username[0].toUpperCase()}</div>
        <span>${esc(u.username)}</span>
        <span class="role-badge ${u.role}">${u.role}</span>
        <div class="user-actions">
          <button class="icon-btn small" onclick="openEditUser('${u.id}')" title="Edit"><i class="fa fa-pen"></i></button>
          ${u.username !== 'admin' ? `<button class="icon-btn small" onclick="deleteUser('${u.id}')" title="Hapus"><i class="fa fa-trash"></i></button>` : ''}
        </div>
      </div>
    `).join('');
  }
  document.getElementById('settings-overlay').classList.remove('hidden');
}
function closeSettings() { document.getElementById('settings-overlay').classList.add('hidden'); }
async function saveAppSettings() {
  const newName = document.getElementById('set-app-name').value.trim();
  const newIcon = document.getElementById('set-app-icon').value.trim() || DEFAULT_APP_ICON;
  const newPass = document.getElementById('set-admin-pass').value;
  if (newName) {
    await sb.from('settings').upsert({ key:'app_name', value:newName });
    state.settings.app_name = newName;
    document.getElementById('brand-name').textContent = newName;
    document.title = newName;
  }
  await sb.from('settings').upsert({ key:'app_icon', value:newIcon });
  state.settings.app_icon = newIcon;
  applyAppIcon(newIcon);
  Store.set('dv_app_icon', newIcon);
  if (newPass && state.user.role === 'admin') {
    await sb.from('users').update({ password:newPass }).eq('id', state.user.id);
    state.user.password = newPass;
    Store.set('dv_user', JSON.stringify(state.user));
  }
  toast('Pengaturan disimpan', 'success');
  closeSettings();
}
async function createUser() {
  const name = document.getElementById('new-user-name').value.trim();
  const pass = document.getElementById('new-user-pass').value;
  const role = document.getElementById('new-user-role').value;
  if (!name || !pass) return toast('Isi username dan password','warning');
  const { error } = await sb.from('users').insert({ username:name, password:pass, role });
  if (error) return toast('Gagal: ' + error.message,'error');
  document.getElementById('new-user-name').value = '';
  document.getElementById('new-user-pass').value = '';
  await openSettings();
  toast('Pengguna ditambahkan','success');
}
async function deleteUser(id) {
  const ok = await askConfirm('Hapus pengguna ini?', { title: 'Hapus Pengguna' });
  if (!ok) return;
  await sb.from('users').delete().eq('id', id);
  await openSettings();
  toast('Pengguna dihapus','success');
}

/* THEME */
function applyTheme(id) {
  const t = THEMES[id] || THEMES['light-1'];
  const root = document.documentElement;
  const map = { bg:'--bg', surface:'--surface', surface2:'--surface2', text:'--text', muted:'--muted',
    border:'--border', primary:'--primary', primaryRgb:'--primary-rgb',
    primaryHover:'--primary-hover', primaryText:'--primary-text',
    accent:'--accent', accentRgb:'--accent-rgb' };
  Object.entries(map).forEach(([k, v]) => root.style.setProperty(v, t[k]));
  document.body.classList.toggle('dark', t.dark);
  state.theme = id;
  Store.set('dv_theme', id);
}
function toggleThemePopover(e) {
  e.stopPropagation();
  let pop = document.getElementById('theme-popover');
  if (pop) { pop.remove(); return; }
  pop = document.createElement('div');
  pop.id = 'theme-popover'; pop.className = 'theme-popover';
  const lightThemes = Object.entries(THEMES).filter(([_,v])=>!v.dark);
  const darkThemes = Object.entries(THEMES).filter(([_,v])=>v.dark);
  pop.innerHTML = `<h4>Light Themes</h4><div class="theme-grid" id="light-grid"></div><h4>Dark Themes</h4><div class="theme-grid" id="dark-grid"></div>`;
  document.body.appendChild(pop);
  const build = (arr, container) => {
    arr.forEach(([id, t]) => {
      const sw = document.createElement('div');
      sw.className = 'theme-swatch' + (state.theme===id?' active':'');
      sw.title = t.name;
      sw.style.background = `linear-gradient(135deg, ${t.primary}, ${t.accent})`;
      sw.onclick = (ev) => { ev.stopPropagation(); applyTheme(id); pop.remove(); };
      container.appendChild(sw);
    });
  };
  build(lightThemes, pop.querySelector('#light-grid'));
  build(darkThemes, pop.querySelector('#dark-grid'));
  setTimeout(() => {
    document.addEventListener('click', function closePop(ev) {
      if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', closePop); }
    });
  }, 0);
}

/* HELPERS */
function logout() {
  Store.remove('dv_user');
  state.user = null;
  document.getElementById('app').classList.add('hidden');
  showLogin();
  toast('Anda telah keluar', 'info');
}
function toast(msg, type='info') {
  const icons = { info:'info-circle', success:'check-circle', error:'exclamation-circle', warning:'exclamation-triangle' };
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.innerHTML = `<i class="fa fa-${icons[type]}"></i><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3500);
}
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now()+'_'+Math.random().toString(36).slice(2); }
function isImageType(mime, name) {
  if (mime && mime.startsWith('image/')) return true;
  if (name) return /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(name);
  return false;
}
function iconFor(mime, name) {
  if (mime?.startsWith('image/') || /\.(png|jpe?g|gif|webp|svg)$/i.test(name||'')) return 'fa-image';
  if (mime === 'application/pdf' || /\.pdf$/i.test(name||'')) return 'fa-file-pdf';
  if (/\.(docx?|doc)$/i.test(name||'')) return 'fa-file-word';
  if (/\.(xlsx?|xls|csv)$/i.test(name||'')) return 'fa-file-excel';
  if (/\.(pptx?|ppt)$/i.test(name||'')) return 'fa-file-powerpoint';
  if (/\.(zip|rar|7z)$/i.test(name||'')) return 'fa-file-archive';
  if (/\.(mp4|mov|avi|mkv)$/i.test(name||'')) return 'fa-file-video';
  if (/\.(mp3|wav|ogg)$/i.test(name||'')) return 'fa-file-audio';
  if (/\.(txt|md)$/i.test(name||'')) return 'fa-file-alt';
  return 'fa-file';
}
